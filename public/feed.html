<!DOCTYPE html>
<html lang="es">
<head>
<script src="/js/device-gate.js"></script>
<script src="/js/algoritmo.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Ximvid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;font-family:'DM Sans',sans-serif;color:#fff;}

@keyframes metalSlide{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes panelUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ── FEED CONTAINER ── */
#feed{
  position:fixed;inset:0;
  overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
#feed::-webkit-scrollbar{display:none}

/* ── VIDEO SLIDE ── */
.slide{
  width:100%;height:100vh;height:100dvh;
  position:relative;overflow:hidden;
  scroll-snap-align:start;scroll-snap-stop:always;
  background:#000;flex-shrink:0;
}
.slide-video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background:#000;
}
/* Gradientes sobre el video */
.slide-gradient-top{position:absolute;top:0;left:0;right:0;height:180px;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);z-index:2;pointer-events:none;}
.slide-gradient-bottom{position:absolute;bottom:0;left:0;right:0;height:280px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);z-index:2;pointer-events:none;}
/* Spinner de carga (dos puntos girando, estilo TikTok) */
.slide-spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;display:none;pointer-events:none;}
.slide-spinner.show{display:block;}
.slide-spinner div{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.85);display:inline-block;margin:0 3px;animation:spinBounce 1s infinite ease-in-out;}
.slide-spinner div:nth-child(2){animation-delay:.2s;}
@keyframes spinBounce{0%,80%,100%{opacity:.3;transform:scale(.7);}40%{opacity:1;transform:scale(1);}}
/* Barra modo creador (viendo videos de un solo usuario) */
.userfeed-bar{position:fixed;top:0;left:0;right:0;z-index:50;display:none;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);}
.userfeed-bar.show{display:flex;}
.userfeed-back{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:1.05rem;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.userfeed-name{color:#fff;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.7);}

/* ── TOP BAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:max(14px,env(safe-area-inset-top)) 16px 10px;
  display:flex;justify-content:center;
}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:100px;padding:4px;}
.tab{
  padding:7px 16px;border-radius:100px;border:none;background:transparent;
  color:rgba(255,255,255,.5);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:400;
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
.tab.active{background:rgba(255,255,255,.15);color:#fff;font-weight:500;}

/* ── RIGHT COLUMN ── */
.right-col{
  position:fixed;right:10px;
  bottom:calc(72px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:4px;
  z-index:50;
}
/* Avatar fijo */
.creator-av{
  width:44px;height:44px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.85);
  object-fit:cover;cursor:pointer;
  background:linear-gradient(135deg,#0b1a30,#2258a8,#4a90d9);
  box-shadow:0 2px 12px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;overflow:hidden;flex-shrink:0;
  margin-bottom:8px;
}
.creator-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

/* Scroll container para iconos */
.icons-scroll{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  max-height:calc(100dvh - 280px);
  overflow-y:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  padding:2px 0;
  /* Fade abajo indicando más */
  -webkit-mask-image:linear-gradient(to bottom,black 70%,transparent 100%);
  mask-image:linear-gradient(to bottom,black 70%,transparent 100%);
}
.icons-scroll::-webkit-scrollbar{display:none}

.net-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;padding:4px;
  transition:transform .2s;
}
.net-btn:active{transform:scale(.88)}
.net-icon-wrap{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
  box-shadow:0 3px 10px rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.15);
  position:relative;overflow:hidden;
}
.net-icon-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:rgba(255,255,255,.2);}
.net-followers{font-size:.62rem;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.8);font-weight:400;line-height:1;}

/* Share btn */
.share-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;padding:4px;margin-top:4px;
  transition:transform .2s;
}
.share-btn:active{transform:scale(.88)}
.share-icon{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 3px 10px rgba(0,0,0,.4);}
.share-label{font-size:.62rem;color:rgba(255,255,255,.6);text-shadow:0 1px 3px rgba(0,0,0,.8);}

/* ── CREATOR INFO (bottom left) ── */
.creator-info{
  position:fixed;left:14px;right:64px;
  bottom:calc(140px + env(safe-area-inset-bottom));
  z-index:50;pointer-events:none;
}
.creator-name{
  font-size:.95rem;font-weight:600;color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 20px rgba(0,0,0,.5);
  margin-bottom:4px;display:flex;align-items:center;gap:6px;
}
.creator-desc{
  font-size:.8rem;font-weight:300;color:rgba(255,255,255,.82);
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  line-height:1.45;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.hashtags{display:flex;flex-wrap:wrap;gap:5px;pointer-events:auto;}
.hashtag{
  font-size:.75rem;color:rgba(180,220,255,.9);
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  cursor:pointer;font-weight:400;
}
.hashtag:hover{color:#fff;}

/* ── CTA BUTTON ── */
.cta-wrap{
  position:fixed;left:14px;right:64px;
  bottom:calc(70px + env(safe-area-inset-bottom));
  z-index:60;
}
.cta-btn{
  width:100%;padding:13px 20px;border:none;border-radius:14px;
  font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;
  cursor:pointer;color:#fff;text-align:center;
  position:relative;overflow:hidden;
  background:linear-gradient(115deg,#3d2800,#7a5200,#c8860a,#f0b429,#c8860a,#7a5200,#3d2800);
  background-size:300% 100%;animation:metalSlide 5s linear infinite;
  box-shadow:0 4px 20px rgba(200,134,10,.5),0 1px 0 rgba(255,255,255,.25) inset,0 0 20px rgba(240,180,41,.2);
}
.cta-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);}
.cta-btn:active{transform:scale(.97)}

/* ── BOTTOM NAV ── */
.botnav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom));
  background:rgba(0,0,0,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;justify-content:space-around;align-items:center;
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 14px;transition:opacity .2s;}
.nav-item:active{opacity:.6}
.nav-ico{font-size:1.3rem;line-height:1;}
.nav-lbl{font-size:.6rem;color:rgba(255,255,255,.45);font-weight:400;letter-spacing:.04em;}
.nav-item.active .nav-ico{opacity:1}
.nav-item.active .nav-lbl{color:rgba(255,255,255,.85)}
.nav-plus{
  width:48px;height:32px;border-radius:10px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;font-weight:700;color:#fff;
  background:linear-gradient(115deg,#06101e,#0f2040,#1a3668,#2258a8,#1a3668,#0f2040,#06101e);
  background-size:300% 100%;animation:metalSlide 5s linear infinite;
  box-shadow:0 2px 12px rgba(34,88,168,.45),0 1px 0 rgba(255,255,255,.12) inset;
  position:relative;overflow:hidden;
}
.nav-plus::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);}

/* ── PRODUCT PANEL ── */
.product-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:linear-gradient(145deg,rgba(10,22,40,.98),rgba(6,16,30,.96));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.12);
  border-radius:24px 24px 0 0;
  padding:12px 12px max(16px,env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .38s cubic-bezier(.34,1.2,.64,1);
}
.product-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);border-radius:24px 24px 0 0;}
.product-panel.open{transform:translateY(0);}
.panel-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 18px;}
.panel-content{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px;}
.panel-img{width:88px;height:88px;border-radius:14px;object-fit:cover;background:rgba(255,255,255,.08);flex-shrink:0;border:1px solid rgba(255,255,255,.1);}
.panel-img-placeholder{width:88px;height:88px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;}
.panel-info{flex:1;min-width:0;}
.panel-name{font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:400;color:rgba(255,255,255,.6);margin-bottom:2px;line-height:1.3;letter-spacing:.01em;}
.panel-price{font-size:2.4rem;font-weight:600;margin-bottom:4px;
  background:linear-gradient(115deg,#3d2800,#7a5200,#c8860a,#f0b429,#c8860a,#7a5200,#3d2800);
  background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:metalSlide 5s linear infinite;
}
.panel-desc{font-size:.88rem;color:rgba(255,255,255,.7);font-weight:300;line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.panel-buy{
  width:100%;padding:16px;border:none;border-radius:16px;
  font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;
  cursor:pointer;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(115deg,#06101e,#0f2040,#1a3668,#2258a8,#1a3668,#0f2040,#06101e);
  background-size:300% 100%;animation:metalSlide 5s linear infinite;
  box-shadow:0 6px 24px rgba(34,88,168,.45),0 1px 0 rgba(255,255,255,.12) inset;
}
.panel-buy::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);}
.panel-buy:active{transform:scale(.98)}
.panel-overlay{position:fixed;inset:0;z-index:190;background:rgba(0,0,0,.4);display:none;}
.panel-overlay.show{display:block;}
.panel-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.08);border:none;border-radius:50%;width:28px;height:28px;color:rgba(255,255,255,.5);font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* ── LOADING ── */
.feed-loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:14px;}
.feed-spinner{width:32px;height:32px;border:3px solid rgba(74,144,217,.2);border-top-color:#4a90d9;border-radius:50%;animation:spin 1s linear infinite;}
.feed-loading-text{font-size:.82rem;color:rgba(255,255,255,.3);}

/* ── EMPTY ── */
.feed-empty{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:40px;}
.feed-empty-icon{font-size:3rem;}
.feed-empty-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;}
.feed-empty-sub{font-size:.88rem;color:rgba(255,255,255,.4);font-weight:300;line-height:1.6;}

/* --- REDISENO FICHA PRODUCTO --- */
.product-panel{background:rgba(255,255,255,.16) !important;backdrop-filter:blur(28px) !important;-webkit-backdrop-filter:blur(28px) !important;}
.panel-seller{display:flex;align-items:center;gap:9px;padding:4px 4px 10px;}
.panel-seller img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(240,180,41,.7);}
.panel-seller .ps-avatar-letter{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);font-weight:600;color:#fff;}
.panel-seller .ps-name{font-size:.86rem;font-weight:500;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.panel-top-row{display:flex;gap:12px;align-items:flex-start;padding:0 4px 8px;}
.panel-top-row #panel-img-wrap{margin:0;}
.panel-top-row #panel-img-wrap img{width:130px !important;height:130px !important;max-width:130px !important;object-fit:cover !important;border-radius:10px !important;}
.panel-info-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
.panel-info-col .panel-name{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:500;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);margin-bottom:4px;line-height:1.1;}
.panel-info-col .panel-price{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;background:linear-gradient(115deg,#7a5200,#c8860a,#f0b429,#ffd76a,#f0b429,#c8860a,#7a5200);background-size:300% 100%;animation:metalSlide 5s linear infinite;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.panel-info-col .panel-desc{font-size:.82rem;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.5);line-height:1.35;}
</style>
</head>
<body>

<!-- LOADING -->
<div class="feed-loading" id="feed-loading">
  <div class="feed-spinner"></div>
  <div class="feed-loading-text">Cargando feed...</div>
</div>

<!-- TOP BAR -->
<div class="topbar" id="topbar-wrap" style="display:none">
  <div class="tabs">
    <button class="tab active" onclick="setTab('foryou',this)">Para ti</button>
    <button class="tab" onclick="setTab('following',this)">Siguiendo</button>
    <button class="tab" data-tab="categories" onclick="setTab('categories',this)">Categorías</button>
    <button class="tab" onclick="setTab('nearby',this)">Cerca</button>
  </div>
</div>

<!-- SLIDER DISTANCIA -->
<div id="nearby-slider" style="display:none;position:fixed;top:calc(max(14px,env(safe-area-inset-top)) + 54px);left:0;right:0;z-index:95;padding:10px 16px 8px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);">

  <!-- Fila: limpiar -->
  <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
    <div onclick="clearNearbyFilters()" style="padding:6px 10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:rgba(255,255,255,.6);font-size:.8rem;cursor:pointer;white-space:nowrap;">✕ Reset</div>
  </div>
  <div id="nearby-category-dropdown" style="display:none;background:#0f2040;border:1px solid rgba(255,255,255,.1);border-radius:10px;margin-bottom:8px;overflow:hidden;max-height:140px;overflow-y:auto;"></div>

  <!-- Slider distancia -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
    <span style="font-size:.75rem;color:rgba(255,255,255,.5);">Distancia</span>
    <span id="nearby-label" style="font-size:.85rem;color:#f0b429;font-weight:600;">50 km</span>
  </div>
  <input type="range" id="nearby-range" min="0" max="4" step="1" value="1"
    style="width:100%;accent-color:#f0b429;cursor:pointer;"
    oninput="updateNearbySlider(this.value)">
  <div style="display:flex;justify-content:space-between;margin-top:4px;">
    <span style="font-size:.65rem;color:rgba(255,255,255,.35);">25km</span>
    <span style="font-size:.65rem;color:rgba(255,255,255,.35);">50km</span>
    <span style="font-size:.65rem;color:rgba(255,255,255,.35);">100km</span>
    <span style="font-size:.65rem;color:rgba(255,255,255,.35);">500km</span>
    <span style="font-size:.65rem;color:rgba(255,255,255,.35);">País</span>
  </div>
</div>

<!-- SELECTOR CATEGORIAS -->
<div id="category-selector" style="display:none;position:fixed;top:calc(max(14px,env(safe-area-inset-top)) + 54px);left:0;right:0;z-index:95;padding:10px 16px 8px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:0;">
    <input type="text" id="category-input" placeholder="Busca una categoría..."
      style="flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;color:#fff;font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;"
      oninput="filterFeedCategories(this.value)" onfocus="showCategories()" onblur="setTimeout(()=>document.getElementById('category-list').style.display='none',200)">
    <div onclick="clearCategoryFilter()" style="padding:6px 10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:rgba(255,255,255,.6);font-size:.8rem;cursor:pointer;white-space:nowrap;">✕ Reset</div>
  </div>
  <div id="category-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:120px;overflow-y:auto;"></div>
</div>

<!-- FEED -->
<div id="feed" onclick="document.getElementById('nearby-slider').style.display='none';document.getElementById('category-selector').style.display='none';"></div>

<!-- RIGHT COLUMN -->
<div class="right-col" id="right-col" style="display:none">
  <div class="creator-av" id="creator-av" onclick="goLanding()">👤</div>
  <div class="icons-scroll" id="icons-scroll"></div>
  <div class="share-btn" onclick="shareVideo()">
    <div class="share-icon">↗️</div>
    <div class="share-label">Compartir</div>
  </div>
  <div class="share-btn" onclick="openReportModal()">
    <div class="share-icon">🚩</div>
    <div class="share-label">Reportar</div>
  </div>
</div>

<!-- REPORT MODAL -->
<div id="report-modal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;">
  <div style="background:#181820;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px;width:min(340px,90vw);font-family:'DM Sans',sans-serif;">
    <div style="font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:12px;">🚩 Reportar vídeo</div>
    <div id="report-reasons" style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;"></div>
    <div id="report-msg" style="display:none;font-size:.85rem;color:#f0b429;margin-bottom:10px;"></div>

<script>
let currentTab = 'foryou';
let videos = [];
let currentIndex = 0;
let feedCursorScore = null;   // ultimo doc cargado (cursor por score)
let cargandoMas = false;      // evita cargas duplicadas
let feedAgotado = false;      // true cuando no quedan mas videos
let idsCargados = new Set();  // ids ya en el feed (evita duplicados)
let currentVideo = null;

// ── TABS ─────────────────────────────────────────────────────
async function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (tab !== 'nearby') {
    document.getElementById('nearby-slider').style.display = 'none';
  }
  if (tab !== 'categories') {
    document.getElementById('category-selector').style.display = 'none';
  }
  if (tab === 'foryou' || tab === 'following') {
    _activeCategory = '';
    const ci = document.getElementById('category-input');
    if (ci) ci.value = '';
    const catTab = document.querySelector('[data-tab="categories"]');
    if (catTab) catTab.textContent = 'Categorías';
  }
  await loadFeed(tab);
}

// ── LOAD FEED ─────────────────────────────────────────────────
async function loadFeed(tab) {
  try {
    const db = window._db;
    const fb = window._fb;
    const userData = window._userData || {};
    const userLang = userData.language || localStorage.getItem('ximvid_lang') || 'es';

    let q;
    if (tab === 'tagfeed' && window._tagFeed) {
      // Modo hashtag: solo videos con ese hashtag
      q = fb.query(
        fb.collection(db, 'videos'),
        fb.where('hashtags', 'array-contains', window._tagFeed),
        fb.where('isActive', '==', true),
        fb.limit(50)
      );
    } else if (tab === 'userfeed' && window._userFeedUid) {
      // Modo TikTok: solo los videos de un creador
      q = fb.query(
        fb.collection(db, 'videos'),
        fb.where('userId', '==', window._userFeedUid),
        fb.where('isActive', '==', true),
        fb.orderBy('createdAt', 'desc'),
        fb.limit(50)
      );
    } else if (tab === 'foryou') {
      // Videos del mismo idioma, ordenados por fecha
      q = fb.query(
        fb.collection(db, 'videos'),
        fb.where('isActive', '==', true),
        fb.where('userLanguage', '==', userLang),
        fb.orderBy('score', 'desc'),
        fb.limit(40)
      );
    } else if (tab === 'categories') {
      // Mostrar siempre el selector y esperar seleccion
      showCategorySelector();
      return;
      const catClean = _activeCategory.replace(/\p{Emoji}/gu, '').trim();
      const allCatSnap = await fb.getDocs(fb.query(
        fb.collection(db, 'videos'),
        fb.where('isActive', '==', true),
        fb.where('category', '==', _activeCategory),
        fb.orderBy('createdAt', 'desc'),
        fb.limit(20)
      ));
      videos = allCatSnap.docs.map(d => ({id: d.id, ...d.data()}));
      if (videos.length === 0) {
        document.getElementById('feed').innerHTML = '';
        showEmpty();
        return;
      }
      renderFeed();
      return;
    } else if (tab === 'nearby') {
      // Mostrar slider
      document.getElementById('nearby-slider').style.display = 'block';
      let myLat = window._userData?.lat;
      let myLng = window._userData?.lng;
      // Si no hay en memoria, leer de Firestore
      if (!myLat || !myLng) {
        try {
          const usnap = await fb.getDoc(fb.doc(db, 'users', window._currentUser.uid));
          if (usnap.exists()) { myLat = usnap.data().lat; myLng = usnap.data().lng; }
        } catch(e) {}
      }
      if (!myLat || !myLng) {
        document.getElementById('nearby-slider').style.display = 'none';
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
              const { latitude: lat, longitude: lng } = pos.coords;
              window._userData.lat = lat;
              window._userData.lng = lng;
              await window._fb.updateDoc(window._fb.doc(window._db, 'users', window._currentUser.uid), { lat, lng });
              loadFeed('nearby');
            } catch(e) {}
          }, () => {});
        }
        return;
      }
      // Cargar todos los videos activos y filtrar por distancia en cliente
      const allSnap = await fb.getDocs(fb.query(
        fb.collection(db, 'videos'),
        fb.where('isActive', '==', true),
        fb.orderBy('createdAt', 'desc'),
        fb.limit(100)
      ));
      const filtered = allSnap.docs
        .map(d => ({id: d.id, ...d.data()}))
        .filter(v => {
          const distOk = _nearbyKm === null || _nearbyKm === 99999 || (v.lat && v.lng && distanceKm(myLat, myLng, v.lat, v.lng) <= _nearbyKm);
          const catOk = !_activeCategory || v.category === _activeCategory;
          return distOk && catOk;
        });
      videos = filtered;
      renderFeed();
      return;
    } else if (tab === 'following') {
      // Leer follows del usuario
      const uid = window._userData?.uid;
      if (!uid) { videos = []; renderFeed(); return; }
      const followsSnap = await fb.getDocs(fb.query(
        fb.collection(db, 'follows'),
        fb.where('followerId', '==', uid)
      ));
      const followingIds = followsSnap.docs.map(d => d.data().followingId);
      if (followingIds.length === 0) { videos = []; renderFeed(); return; }
      // Firestore solo permite 'in' con max 10 valores
      const ids = followingIds.slice(0, 10);
      q = fb.query(
        fb.collection(db, 'videos'),
        fb.where('isActive', '==', true),
        fb.where('userId', 'in', ids),
        fb.orderBy('createdAt', 'desc'),
        fb.limit(20)
      );
    } else {
      q = fb.query(
        fb.collection(db, 'videos'),
        fb.where('isActive', '==', true),
        fb.orderBy('score', 'desc'),
        fb.limit(40)
      );
    }

    const snap = await fb.getDocs(q);
    videos = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    // Reset de paginacion en cada carga de feed
    feedCursorScore = snap.docs.length ? snap.docs[snap.docs.length - 1] : null;
    feedAgotado = snap.docs.length < 40;
    cargandoMas = false;
    idsCargados = new Set(videos.map(v => v.id));

    // ── ALGORITMO: filtrar vistos + inyectar premium (solo feed principal)
    const esFeedPrincipal = (tab === 'foryou' || !tab || tab === 'home');
    window._esFeedPrincipal = esFeedPrincipal;
    if (esFeedPrincipal && window._algo) {
      try {
        videos = window._algo.filtrarVistos(videos, 5);
        let cada = 4;
        try {
          const cfgSnap = await fb.getDoc(fb.doc(db, 'config', 'algoritmo'));
          if (cfgSnap.exists() && cfgSnap.data().boostPremiumCada) cada = cfgSnap.data().boostPremiumCada;
        } catch(e) {}
        const yaIds = new Set(videos.map(v => v.id));
        const premSnap = await fb.getDocs(fb.query(
          fb.collection(db, 'videos'),
          fb.where('isActive', '==', true),
          fb.where('isPremiumUser', '==', true),
          fb.orderBy('score', 'desc'),
          fb.limit(15)
        ));
        let prem = premSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(v => !yaIds.has(v.id));
        const premNoVistos = prem.filter(v => !window._algo.estaVisto(v.id));
        if (premNoVistos.length > 0) prem = premNoVistos;
        prem.sort(() => Math.random() - 0.5);
        if (prem.length > 0 && cada > 0) {
          const mezcla = [];
          let pi = 0;
          for (let i = 0; i < videos.length; i++) {
            mezcla.push(videos[i]);
            if ((i + 1) % cada === 0 && pi < prem.length) {
              mezcla.push(prem[pi++]);
            }
          }
          videos = mezcla;
        }
        videos = videos.slice(0, 25);
        idsCargados = new Set(videos.map(v => v.id));
      } catch(e) { console.warn('algoritmo feed:', e); }
    }

    // Si llegamos por un link, poner ese video primero y evitar duplicado
    if (window._linkVideo) {
      videos = videos.filter(v => v.id !== window._linkVideo.id);
      videos.unshift(window._linkVideo);
      window._linkVideo = null;
    }
    // Barra de salida del modo creador
    if ((tab === 'userfeed' || tab === 'tagfeed') && videos.length > 0) {
      let bar = document.getElementById('userfeed-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'userfeed-bar';
        bar.className = 'userfeed-bar';
        bar.innerHTML = '<div class="userfeed-back" onclick="window.location.href=\'feed.html\'">←</div><div class="userfeed-name" id="userfeed-name"></div>';
        document.body.appendChild(bar);
      }
      const uname = videos[0].username || videos[0].userName || '';
      document.getElementById('userfeed-name').textContent = tab === 'tagfeed' ? ('#' + window._tagFeed) : (uname ? '@' + uname : 'Videos del creador');
      bar.classList.add('show');
    }

    if (videos.length === 0) {
      // Fallback: cargar videos de cualquier idioma
      const qAny = fb.query(
        fb.collection(db, 'videos'),
        fb.where('isActive', '==', true),
        fb.orderBy('createdAt', 'desc'),
        fb.limit(20)
      );
      const snapAny = await fb.getDocs(qAny);
      videos = snapAny.docs.map(d => ({ id: d.id, ...d.data() }));
      if (videos.length === 0) { showEmpty(); return; }
    }

    renderFeed();
  } catch(e) {
    console.error('Error cargando feed:', e);
    // Si falla el índice, cargar sin filtro de idioma
    try {
      const q2 = window._fb.query(
        window._fb.collection(window._db, 'videos'),
        window._fb.where('isActive', '==', true),
        window._fb.orderBy('createdAt', 'desc'),
        window._fb.limit(20)
      );
      const snap2 = await window._fb.getDocs(q2);
      videos = snap2.docs.map(d => ({ id: d.id, ...d.data() }));
      if (videos.length === 0) { showEmpty(); return; }
      renderFeed();
    } catch(e2) {
      showEmpty();
    }
  }
}

// ── RENDER FEED ───────────────────────────────────────────────
function renderFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';

  videos.forEach((video, idx) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.dataset.idx = idx;

    const videoEl = document.createElement('video');
    videoEl.className = 'slide-video';
    videoEl.src = video.videoURL || '';
    videoEl.loop = true;
    videoEl.muted = true;
    videoEl.playsInline = true;
    videoEl.preload = idx === 0 ? 'auto' : 'metadata';
    // Poster: muestra la miniatura al instante mientras carga el video (como TikTok)
    if (video.thumbnailURL) videoEl.poster = video.thumbnailURL;
    // Reproducir automáticamente al hacer tap en iOS
    videoEl.setAttribute('playsinline', '');
    videoEl.setAttribute('webkit-playsinline', '');

    slide.appendChild(videoEl);

    // Gradientes
    const gt = document.createElement('div'); gt.className = 'slide-gradient-top';
    const gb = document.createElement('div'); gb.className = 'slide-gradient-bottom';
    slide.appendChild(gt);
    slide.appendChild(gb);
    // Spinner de carga: aparece solo si el video se queda esperando datos
    const sp = document.createElement('div'); sp.className = 'slide-spinner';
    sp.innerHTML = '<div></div><div></div>';
    slide.appendChild(sp);
    videoEl.addEventListener('waiting', () => sp.classList.add('show'));
    videoEl.addEventListener('playing', () => sp.classList.remove('show'));
    videoEl.addEventListener('canplay', () => sp.classList.remove('show'));

    feed.appendChild(slide);
  });

  // Volver al inicio
  feed.scrollTop = 0;
  currentIndex = 0;

  // Observar qué slide está visible
  setupObserver();

  // Reproducir el primero
  if (videos.length > 0) {
    updateSlide(0);
    // Activar sonido en primer toque del usuario
    const unlockAudio = () => {
      window._audioUnlocked = true;
      const vids = document.querySelectorAll('video');
      vids.forEach(v => { v.muted = false; });
      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('click', unlockAudio);
    };
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });
  }
}

// ── PAGINACION: cargar mas videos (mantiene score, no-repetidos, premium) ──
async function cargarMasVideos() {
  if (cargandoMas || feedAgotado || !window._esFeedPrincipal) return;
  if (!feedCursorScore) return;
  cargandoMas = true;
  try {
    const fb = window._fb, db = window._db;
    const q = fb.query(
      fb.collection(db, 'videos'),
      fb.where('isActive', '==', true),
      fb.orderBy('score', 'desc'),
      fb.startAfter(feedCursorScore),
      fb.limit(30)
    );
    const snap = await fb.getDocs(q);
    if (snap.empty) { feedAgotado = true; return; }
    feedCursorScore = snap.docs[snap.docs.length - 1];
    if (snap.docs.length < 30) feedAgotado = true;

    let nuevos = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                          .filter(v => !idsCargados.has(v.id));
    // Priorizar no vistos, pero si no quedan, mostrar los que sean (nunca vacio)
    if (window._algo) {
      const noVistos = nuevos.filter(v => !window._algo.estaVisto(v.id));
      if (noVistos.length > 0) nuevos = noVistos;
    }
    if (nuevos.length === 0) { return; }

    nuevos.forEach(v => { idsCargados.add(v.id); });
    const base = videos.length;
    videos = videos.concat(nuevos);
    nuevos.forEach((v, i) => appendSlide(v, base + i));
  } catch(e) {
    console.warn('cargarMasVideos:', e);
    feedAgotado = true;
  } finally {
    cargandoMas = false;
  }
}

// Crea un slide y lo engancha (misma estructura que renderFeed)
function appendSlide(video, idx) {
  const feed = document.getElementById('feed');
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.dataset.idx = idx;
  const videoEl = document.createElement('video');
  videoEl.className = 'slide-video';
  videoEl.src = video.videoURL || '';
  videoEl.loop = true; videoEl.muted = true; videoEl.playsInline = true;
  videoEl.preload = 'metadata';
  if (video.thumbnailURL) videoEl.poster = video.thumbnailURL;
  videoEl.setAttribute('playsinline', '');
  videoEl.setAttribute('webkit-playsinline', '');
  slide.appendChild(videoEl);
  const gt = document.createElement('div'); gt.className = 'slide-gradient-top';
  const gb = document.createElement('div'); gb.className = 'slide-gradient-bottom';
  slide.appendChild(gt); slide.appendChild(gb);
  const sp = document.createElement('div'); sp.className = 'slide-spinner';
  sp.innerHTML = '<div></div><div></div>';
  slide.appendChild(sp);
  videoEl.addEventListener('waiting', () => sp.classList.add('show'));
  videoEl.addEventListener('playing', () => sp.classList.remove('show'));
  videoEl.addEventListener('canplay', () => sp.classList.remove('show'));
  feed.appendChild(slide);
  if (window._feedObserver) window._feedObserver.observe(slide);
}

// ── INTERSECTION OBSERVER ─────────────────────────────────────
function setupObserver() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const slide = entry.target;
      const video = slide.querySelector('video');
      const idx = parseInt(slide.dataset.idx);

      if (entry.isIntersecting && entry.intersectionRatio > 0.7) {
        // Pausar el anterior
        if (currentVideo && currentVideo !== video) {
          currentVideo.pause();
        }
        currentVideo = video;
        currentIndex = idx;

        // Reiniciar el video al principio (como TikTok)
        try { video.currentTime = 0; } catch(e) {}

        // Reproducir SIEMPRE mudo primero (el navegador nunca bloquea video mudo)
        // y restaurar el audio despues si el usuario ya lo desbloqueo.
        const wantSound = (window._audioUnlocked === true);
        video.muted = true;
        const tryPlay = () => {
          video.play().then(() => {
            if (wantSound) video.muted = false;
          }).catch(() => {
            // Si aun asi falla, reintentar mudo
            video.muted = true;
            video.play().then(() => { if (wantSound) video.muted = false; }).catch(()=>{});
          });
        };
        tryPlay();
        setTimeout(() => { if (video.paused && currentVideo === video) tryPlay(); }, 120);
        // Fallback final: si sigue parado, arrancar al primer toque
        slide.addEventListener('click', () => { if (video.paused) { video.muted = true; video.play().then(()=>{ if (window._audioUnlocked) video.muted = false; }).catch(()=>{}); } }, { once: true });

        // Registrar vista
        registerView(videos[idx].id);

        // Actualizar UI
        updateSlide(idx);
      } else {
        video.pause();
      }
    });
  }, { threshold: 0.7 });

  window._feedObserver = observer;
  document.querySelectorAll('.slide').forEach(s => observer.observe(s));
}

async function updateSlide(idx) {
  const video = videos[idx];
  if (!video) return;
  // Paginacion: si nos acercamos al final, cargar mas (a 3 del final)
  if (currentTab === "foryou" && idx >= videos.length - 3) { cargarMasVideos(); }
  // VENTANA DE PRECARGA (como TikTok): buffea el actual + 2 siguientes y 1 anterior
  const slides = document.querySelectorAll('.slide');
  slides.forEach((s, i) => {
    const v = s.querySelector('video');
    if (!v) return;
    if (i >= idx - 1 && i <= idx + 2) {
      if (v.preload !== 'auto') v.preload = 'auto';
    } else {
      if (v.preload !== 'none') v.preload = 'none';
    }
  });
  // MURO INVITADO: contar videos vistos y mostrar registro
  if (window._isGuest) {
    window._guestViewed = (window._guestViewed || 0) + 1;

function degToRad(deg) { return deg * Math.PI / 180; }

function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = degToRad(lat2 - lat1);
  const dLng = degToRad(lng2 - lng1);
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(degToRad(lat1))*Math.cos(degToRad(lat2))*
    Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

      { views: window._fb.increment(1) }
    );
    if (window._algo) {
      window._algo.marcarVisto(videoId);
      const vd = window._currentVideoData;
      if (vd && vd.id === videoId) window._algo.registrarImpresionPremium(vd);
    }
  } catch(e) {}
}

async function registerActionClick(videoId) {
  if (!videoId) return;
  try {
    await window._fb.updateDoc(
      window._fb.doc(window._db, 'videos', videoId),
      { actionClicks: window._fb.increment(1) }
    );
    const creatorId = window._currentVideoData?.userId;
    if (window._algo) {
      window._algo.registrarInteraccion(videoId, creatorId, 'cta');
      window._algo.registrarClick(videoId, creatorId, 'cta', null);
    }
    if (creatorId) {
      const me = window._userData || {};
      const actor = (me.uid && me.username) ? { actorUid: me.uid, actorUsername: me.username, actorName: me.name || '' } : null;
      const msg = actor ? ('@' + me.username + ' pulsó tu botón de acción') : 'Alguien pulsó tu botón de acción';
      createNotification(creatorId, 'action_click', msg, actor);
    }
  } catch(e) {}
}

async function createNotification(userId, type, message, extra) {
  if (!userId) return;
  try {
    const data = { userId, type, message, read: false, createdAt: window._fb.serverTimestamp() };
    if (extra) Object.assign(data, extra);
    await window._fb.addDoc(
      window._fb.collection(window._db, 'notifications'),
      data
    );
  } catch(e) { console.error('Error notificacion:', e); }
}

async function registerSocialClick(videoId, network) {
  if (!videoId || !network) return;
  try {
    const update = { socialClicks: window._fb.increment(1) };
    update['net_' + network] = window._fb.increment(1);
    await window._fb.updateDoc(
      window._fb.doc(window._db, 'videos', videoId),
      update
    );
    const creatorId = window._currentVideoData?.userId;
    if (window._algo) {
      window._algo.registrarInteraccion(videoId, creatorId, 'social');
      window._algo.registrarClick(videoId, creatorId, 'social', network);
    }
    const netName = network.charAt(0).toUpperCase() + network.slice(1);
    if (creatorId) {
      const me = window._userData || {};
      const actor = (me.uid && me.username) ? { actorUid: me.uid, actorUsername: me.username, actorName: me.name || '' } : null;
      const msg = actor ? ('@' + me.username + ' visitó tu ' + netName) : ('Alguien visitó tu ' + netName);
      createNotification(creatorId, 'social_click', msg, actor);
    }
  } catch(e) {}
}
