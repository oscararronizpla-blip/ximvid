<!DOCTYPE html>
<html lang="es">
<head>
<script src="/js/device-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<title>Ximvid — Pago Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#06101e 0%,#0a1628 40%,#0f2040 70%,#06101e 100%);color:#fff;min-height:100%;padding-bottom:40px;}
@keyframes metalSlide{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.loading{position:fixed;inset:0;background:#06101e;display:flex;align-items:center;justify-content:center;z-index:500;}
.spinner{width:32px;height:32px;border:3px solid rgba(74,144,217,.2);border-top-color:#4a90d9;border-radius:50%;animation:spin 1s linear infinite;}
.header{padding:max(52px,calc(44px + env(safe-area-inset-top))) 20px 20px;display:flex;align-items:center;gap:12px;}
.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.65);font-size:1rem;text-decoration:none;flex-shrink:0;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;}
.content{padding:0 20px;}
.summary-card{background:linear-gradient(115deg,#06101e,#0f2040,#1a3668,#2258a8,#1a3668,#0f2040,#06101e);background-size:300% 100%;animation:metalSlide 8s linear infinite;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:24px;text-align:center;margin-bottom:24px;position:relative;overflow:hidden;}
.summary-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);}
.summary-icon{font-size:2rem;margin-bottom:8px;}
.summary-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:600;margin-bottom:4px;}
.summary-price{font-size:.9rem;color:rgba(255,255,255,.5);}
.card-section{background:linear-gradient(145deg,rgba(15,32,64,.9),rgba(11,26,48,.86));border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;margin-bottom:16px;}
.card-label{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(168,208,240,.4);margin-bottom:12px;}
#card-element{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px;}
#card-errors{color:#ff6b6b;font-size:.8rem;margin-top:8px;min-height:20px;}
.secure-note{display:flex;align-items:center;gap:6px;font-size:.75rem;color:#f0b429;margin-bottom:24px;font-weight:500;}
.btn-pay{width:100%;padding:16px;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(115deg,#06101e,#0f2040,#1a3668,#2258a8,#1a3668,#0f2040,#06101e);background-size:300% 100%;animation:metalSlide 5s linear infinite;box-shadow:0 6px 24px rgba(34,88,168,.4);}
.btn-pay:disabled{opacity:.5;cursor:not-allowed;}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="spinner"></div></div>
<div id="content" style="display:none">
  <div class="header">
    <a href="/premium.html" class="back-btn">←</a>
    <div class="page-title">Pago seguro</div>
  </div>
  <div class="content">
    <div class="summary-card">
      <div class="summary-icon">⭐</div>
      <div class="summary-title">Plan Premium</div>
      <div class="summary-price">9,99€/mes · Cancela cuando quieras</div>
    </div>
    <div class="card-section">
      <div class="card-label">Datos de pago</div>
      <div id="card-element"></div>
      <div id="card-errors"></div>
    </div>
    <div class="secure-note">🔒 Pago seguro con Stripe. Tus datos están protegidos.</div>
    <button class="btn-pay" id="btn-pay" onclick="submitPayment()">Activar Premium — 9,99€/mes</button>
  </div>
</div>
<script>
const STRIPE_PK = 'pk_test_51TJdDqK9Gng7htSOhdlQUcUMVEVl3Q2yZtCWmfBhSrY6FWIRUD7M5TAIv5sQfShbgqupk57Qxl4Cc03Hqo6VkDNT0030NGERhS';
const stripeData = JSON.parse(sessionStorage.getItem('stripeData') || 'null');

// Si no hay datos de la función, redirigir a premium
if (!stripeData?.clientSecret) {
  window.location.href = '/premium.html';
}

const stripe = Stripe(STRIPE_PK);
const elements = stripe.elements();
const cardElement = elements.create('card', {
  style: {
    base: {
      color: '#fff',
      fontFamily: 'DM Sans, sans-serif',
      fontSize: '16px',
      '::placeholder': { color: 'rgba(255,255,255,.3)' },
      iconColor: '#4a90d9'
    },
    invalid: { color: '#ff6b6b' }
  }
});
cardElement.mount('#card-element');
cardElement.on('change', e => {
  document.getElementById('card-errors').textContent = e.error ? e.error.message : '';
});

document.getElementById('loading').style.display = 'none';
document.getElementById('content').style.display = 'block';

async function submitPayment() {
  const btn = document.getElementById('btn-pay');
  btn.textContent = 'Procesando...';
  btn.disabled = true;

  const {error, paymentIntent} = await stripe.confirmCardPayment(stripeData.clientSecret, {
    payment_method: { card: cardElement }
  });

  if (error) {
    document.getElementById('card-errors').textContent = error.message;
    btn.textContent = 'Activar Premium — 9,99€/mes';
    btn.disabled = false;
  } else if (paymentIntent.status === 'succeeded') {
    btn.textContent = '¡Activado! ⭐';
    try {
      const uid = sessionStorage.getItem('ximvid_uid');
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      const { getFirestore, doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const app = initializeApp({apiKey:"AIzaSyD9rczM9lYndi4nt4Cv4EjE63QekuYxBpI",authDomain:"ximvid-c8627.firebaseapp.com",projectId:"ximvid-c8627",storageBucket:"ximvid-c8627.firebasestorage.app",messagingSenderId:"278931359476",appId:"1:278931359476:web:30fef5be9d11890bef80a1"});
      const db = getFirestore(app);
      if (uid) {
        await updateDoc(doc(db,'users',uid), { isPremium: true });
      }
    } catch(e) { console.error('Error activando Premium:', e); }
    setTimeout(() => { window.location.href = '/premium.html'; }, 1500);
  }
}
</script>
</body>
</html>
