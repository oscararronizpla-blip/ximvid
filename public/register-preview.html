<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<title>Ximvid — Registro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  font-family:'DM Sans',sans-serif;
  background:linear-gradient(160deg,#06101e 0%,#0a1628 40%,#0f2040 70%,#06101e 100%);
  color:#fff;min-height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:0 20px 40px;position:relative;overflow-x:hidden;
}
.bg-grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(74,144,217,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(74,144,217,.04) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 80%);}
.orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.35}
.orb1{width:500px;height:500px;background:rgba(34,88,168,.18);top:-150px;right:-100px}
.orb2{width:350px;height:350px;background:rgba(10,22,40,.3);bottom:-80px;left:-60px}

@keyframes metalSlide{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.header{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;padding:52px 0 24px;position:relative;z-index:5;animation:fadeUp .6s ease both;}
.back-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.65);font-size:1.1rem;transition:all .2s;text-decoration:none;}
.back-btn:hover{background:rgba(255,255,255,.1)}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;letter-spacing:.04em}
.logo em{font-style:italic;background:linear-gradient(135deg,#fff 0%,#a8d0f0 25%,#4a90d9 50%,#a8d0f0 75%,#fff 100%);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:metalSlide 5s linear infinite;}
.header-spacer{width:38px}

.card{width:100%;max-width:420px;background:linear-gradient(145deg,rgba(15,32,64,.95),rgba(11,26,48,.92));border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:32px 28px;position:relative;z-index:5;box-shadow:0 24px 64px rgba(0,0,0,.5);animation:fadeUp .7s .08s ease both;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);border-radius:24px 24px 0 0;}

.tabs{display:flex;background:rgba(255,255,255,.04);border-radius:12px;padding:3px;margin-bottom:28px;}
.tab{flex:1;padding:10px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:500;cursor:pointer;transition:all .25s;}
.tab.active{background:linear-gradient(115deg,#06101e,#0f2040,#1a3668,#2258a8,#1a3668,#0f2040,#06101e);background-size:300% 100%;animation:metalSlide 5s linear infinite;color:#fff;box-shadow:0 2px 10px rgba(34,88,168,.3);position:relative;overflow:hidden;}
.tab.active::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);}
.tab.inactive{background:transparent;color:rgba(255,255,255,.38);}

.form-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;margin-bottom:6px;color:#fff}
.form-title strong{font-weight:600}
.form-subtitle{font-size:.82rem;color:rgba(255,255,255,.38);margin-bottom:24px;font-weight:300}

.field{margin-bottom:14px;position:relative}
.field label{display:block;font-size:.76rem;font-weight:500;color:rgba(168,208,240,.6);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}

/* Username field especial */
.username-wrap{position:relative}
.username-prefix{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);font-size:.9rem;pointer-events:none;font-family:'DM Sans',sans-serif;}
.username-input{padding-left:32px !important}
.username-status{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:.85rem;font-weight:600;}
.username-hint{font-size:.72rem;color:rgba(255,255,255,.25);margin-top:5px;font-weight:300;}

.field input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;color:#fff;font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none;appearance:none;}
.field input::placeholder{color:rgba(255,255,255,.25)}
.field input:focus{border-color:rgba(74,144,217,.5);background:rgba(74,144,217,.06)}
.field input.error{border-color:rgba(255,102,128,.5) !important;background:rgba(255,45,85,.04) !important}
.field input.ok{border-color:rgba(52,199,89,.4) !important}

.error-msg{display:none;background:rgba(255,45,85,.08);border:1px solid rgba(255,45,85,.2);border-radius:10px;padding:10px 14px;font-size:.82rem;color:#ff8099;margin-bottom:14px;}
.error-msg.show{display:flex;align-items:center;gap:8px}

.pass-strength{height:3px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}
.pass-strength-fill{height:100%;border-radius:2px;width:0%;transition:width .3s,background .3s}

.btn-submit{width:100%;padding:15px;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;color:#fff;margin-top:4px;margin-bottom:12px;position:relative;overflow:hidden;background:linear-gradient(115deg,#06101e,#0f2040,#1a3668,#2258a8,#1a3668,#0f2040,#06101e);background-size:300% 100%;animation:metalSlide 6s linear infinite;box-shadow:0 6px 24px rgba(34,88,168,.35),0 1px 0 rgba(255,255,255,.12) inset;transition:transform .2s,box-shadow .2s;}
.btn-submit::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;animation:none}
.btn-submit:active:not(:disabled){transform:scale(.98)}

.divider{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
.divider span{font-size:.75rem;color:rgba(255,255,255,.25)}

.btn-google{width:100%;padding:13px;border:1px solid rgba(255,255,255,.12);border-radius:14px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:400;cursor:pointer;color:rgba(255,255,255,.72);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;}
.btn-google:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.btn-google:active{transform:scale(.98)}
.google-icon{width:18px;height:18px;flex-shrink:0}

.terms-text{font-size:.72rem;color:rgba(255,255,255,.22);text-align:center;margin-top:16px;line-height:1.5;}
.terms-text a{color:rgba(168,208,240,.45);text-decoration:underline}

.success-screen{display:none;text-align:center;padding:16px 0;}
.success-icon{font-size:3rem;margin-bottom:16px;animation:bounceIn .6s ease}
@keyframes bounceIn{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.success-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:600;margin-bottom:8px}
.success-sub{font-size:.88rem;color:rgba(255,255,255,.48);font-weight:300}
</style>
<style>
.rp-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px;position:relative;z-index:2;}
.rp-logo{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.9rem;color:#fff;letter-spacing:.5px;margin-bottom:24px;}
.rp-logo em{font-style:italic;color:#f0b429;}
.rp-headline{font-family:'DM Sans',sans-serif;font-weight:600;font-size:2.1rem;line-height:1.1;text-align:center;letter-spacing:1px;margin-bottom:44px;text-transform:uppercase;
  color:#f0b429;
  text-shadow:0 0 8px rgba(240,180,41,.7),0 0 22px rgba(240,180,41,.45),0 0 40px rgba(240,180,41,.25);
  animation:rpGlow 2.8s ease-in-out infinite;}
@keyframes rpGlow{0%,100%{text-shadow:0 0 8px rgba(240,180,41,.7),0 0 22px rgba(240,180,41,.45),0 0 40px rgba(240,180,41,.25);}50%{text-shadow:0 0 12px rgba(240,180,41,.9),0 0 30px rgba(240,180,41,.6),0 0 55px rgba(240,180,41,.4);}}
.rp-google{position:relative;width:100%;max-width:330px;aspect-ratio:1/.62;border:none;border-radius:40px;padding:0 24px;cursor:pointer;
  background:linear-gradient(115deg,#06101e,#0f2040,#1a3668,#2258a8,#1a3668,#0f2040,#06101e);
  background-size:300% 100%;animation:metalSlide 6s linear infinite;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  box-shadow:0 16px 60px rgba(34,88,168,.45),inset 0 1px 0 rgba(255,255,255,.18);}
.rp-google:active{transform:scale(.97);}
.rp-google .g-circle{width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,.3);}
.rp-google .g-txt{font-family:'DM Sans',sans-serif;font-size:1.25rem;font-weight:500;color:#fff;}
.rp-pulse{position:absolute;inset:0;border-radius:40px;border:2px solid rgba(120,170,255,.5);animation:rpPulse 2.4s ease-out infinite;pointer-events:none;}
@keyframes rpPulse{0%{opacity:.7;transform:scale(1);}100%{opacity:0;transform:scale(1.06);}}
.rp-or{margin:30px 0 18px;color:rgba(255,255,255,.4);font-family:'DM Sans',sans-serif;font-size:.82rem;}
.rp-email{background:none;border:none;color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;font-size:1rem;cursor:pointer;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.2);}
.rp-terms{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-family:'DM Sans',sans-serif;font-size:.72rem;color:rgba(255,255,255,.35);padding:0 30px;line-height:1.5;}
.rp-terms a{color:rgba(255,255,255,.55);}
</style>
<div class="bg-grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="rp-wrap">
  <div class="rp-logo">xim<em>vid</em></div>
  <div class="rp-headline">Tu vídeo<br>son tus redes<br>sociales</div>
  <button class="rp-google" onclick="alert('Aqui ira el login de Google')">
    <span class="rp-pulse"></span>
    <span class="g-circle">
      <svg width="40" height="40" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    </span>
    <span class="g-txt">Continuar con Google</span>
  </button>
  <div class="rp-or">o</div>
  <button class="rp-email" onclick="alert('Aqui ira la pantalla de email')">Registrarse con email</button>
  <div class="rp-terms">Al continuar aceptas los <a href="/terms.html">Términos</a> y la <a href="/privacy.html">Política de privacidad</a></div>
</div>
</body>
</html>
