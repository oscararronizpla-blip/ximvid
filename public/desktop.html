<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ximvid - App movil</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#0a0f1e 0%,#101c38 60%,#0a0f1e 100%);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#fff; text-align:center; }
  .box { max-width:420px; padding:40px 30px; }
  .logo { font-size:44px; font-weight:800; letter-spacing:1px;
    background:linear-gradient(90deg,#e8c15a,#f5e3a8); -webkit-background-clip:text;
    -webkit-text-fill-color:transparent; margin-bottom:18px; }
  h1 { font-size:22px; font-weight:600; margin-bottom:12px; }
  p { color:#9fb0d0; font-size:15px; line-height:1.6; margin-bottom:28px; }
  .play-btn { display:inline-block; background:#1f2a44; color:#7f8db0;
    padding:14px 28px; border-radius:12px; font-size:15px; font-weight:600;
    cursor:default; border:1px solid #2c3a5c; margin-bottom:34px; }
  .qr-block { border-top:1px solid #1f2a44; padding-top:26px; }
  .qr-block img { width:120px; height:120px; border-radius:10px; background:#fff; padding:6px; }
  .qr-block span { display:block; margin-top:10px; font-size:13px; color:#7f8db0; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">XIMVID</div>
    <h1>Ximvid está diseñada para móvil</h1>
    <p>Descubre vídeos de creadores y conecta con todas sus redes sociales desde tu smartphone.</p>
    <div class="play-btn">▶ Próximamente en Google Play</div>
    <div class="qr-block">
      <img src="/img/qr-web.png" alt="QR Ximvid">
      <span>Escanea con tu móvil para probar la beta</span>
    </div>
  </div>
</body>
</html>
