<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analitica Redes — Ximvid</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:linear-gradient(160deg,#06101e 0%,#0a1628 40%,#0f2040 70%,#06101e 100%);font-family:"DM Sans",sans-serif;color:#fff;overflow-x:hidden}
@keyframes metalSlide{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes countUp{from{opacity:0}to{opacity:1}}
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:max(14px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;background:rgba(6,16,30,.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.06)}
.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .2s}
.topbar-title{font-family:"Cormorant Garamond",serif;font-size:1.25rem;font-weight:600}
.content{padding:calc(max(14px,env(safe-area-inset-top)) + 62px) 16px max(32px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.period-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.period-row::-webkit-scrollbar{display:none}
.period-btn{padding:7px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.45);font-family:"DM Sans",sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s}
.period-btn.active{background:linear-gradient(115deg,#06101e,#0f2040,#1a3668,#2258a8,#1a3668,#0f2040,#06101e);background-size:300% 100%;animation:metalSlide 6s linear infinite;border-color:transparent;color:#fff}
.card{background:linear-gradient(145deg,rgba(15,32,64,.85),rgba(11,26,48,.9));border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:20px;animation:fadeUp .4s ease both}
.section-label{font-size:.65rem;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px;text-align:center}
.metric-num{font-family:"Cormorant Garamond",serif;font-size:2.2rem;font-weight:300;background:linear-gradient(135deg,#7a5200,#c8860a,#f0b429,#fff9e6);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:metalSlide 4s linear infinite}
.metric-lbl{font-size:.72rem;color:rgba(255,255,255,.4);margin-top:2px}
.chart-wrap{position:relative;width:100%;height:220px;margin:8px 0}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.donut-total{font-family:"Cormorant Garamond",serif;font-size:2rem;font-weight:300;background:linear-gradient(135deg,#c8860a,#f0b429);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.donut-sub{font-size:.65rem;color:rgba(255,255,255,.35);margin-top:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.75rem;color:rgba(255,255,255,.6)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.bars-chart-wrap{position:relative;width:100%;height:200px}
.video-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.video-row:last-child{border-bottom:none;padding-bottom:0}
.vthumb{width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,.06);overflow:hidden;flex-shrink:0;border:1px solid rgba(255,255,255,.08)}
.vthumb video{width:100%;height:100%;object-fit:cover}
.vinfo{flex:1;min-width:0}
.vdesc{font-size:.85rem;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.vnets{display:flex;gap:4px;flex-wrap:wrap}
.vchip{font-size:.68rem;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.45)}
.vcount{font-family:"Cormorant Garamond",serif;font-size:1.8rem;font-weight:300;background:linear-gradient(135deg,#c8860a,#f0b429);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0}
.empty{text-align:center;padding:32px 16px;color:rgba(255,255,255,.25);font-size:.9rem}
.loading-msg{text-align:center;padding:32px;color:rgba(255,255,255,.3);font-size:.88rem}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="history.back()">&#8592;</button>
  <div class="topbar-title">Analitica de Redes</div>
</div>
<div class="content">
  <div class="period-row">
    <button class="period-btn" onclick="setPeriod(this)">Últimas 24h</button>
    <button class="period-btn active" onclick="setPeriod(this)">Últimos 7 días</button>
    <button class="period-btn" onclick="setPeriod(this)">Últimos 30 días</button>
    <button class="period-btn" onclick="setPeriod(this)">Últimos 90 días</button>
  </div>

  <div class="metrics-grid">
    <div class="metric-box"><div class="metric-num" id="m-total">—</div><div class="metric-lbl">clics totales</div></div>
    <div class="metric-box"><div class="metric-num" id="m-nets">—</div><div class="metric-lbl">redes activas</div></div>
  </div>

  <div class="card" style="animation-delay:.05s">
    <div class="section-label">distribucion por red</div>
    <div style="position:relative">
      <div class="chart-wrap"><canvas id="donutChart" role="img" aria-label="Grafico donut de clics por red social">Distribucion de clics por red social.</canvas></div>
      <div class="donut-center"><div class="donut-total" id="donut-total">0</div><div class="donut-sub">clics</div></div>
    </div>
    <div class="legend" id="donut-legend"></div>
  </div>

  <div class="card" style="animation-delay:.1s">
    <div class="section-label">ranking de redes</div>
    <div class="bars-chart-wrap"><canvas id="barsChart" role="img" aria-label="Grafico de barras horizontal con ranking de redes sociales">Ranking de redes por numero de clics.</canvas></div>
  </div>

  <div class="card" style="animation-delay:.15s">
    <div class="section-label">videos destacados</div>
    <div id="video-list"><div class="loading-msg">Cargando...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

let donutChart=null,barsChart=null,uid=null;
const DAYS=[1,7,30,90];
window.setPeriod=function(el){
  document.querySelectorAll(".period-btn").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
  const idx=Array.from(document.querySelectorAll(".period-btn")).indexOf(el);
  loadData(DAYS[idx]);
};
onAuthStateChanged(auth,async user=>{
  if(!user){window.location.href="/welcome.html";return;}
  uid=user.uid;
  loadData(7);
});
async function loadData(days){
  if(!uid)return;
  try{
    const since=new Date(Date.now()-days*24*60*60*1000);
    const vSnap=await getDocs(query(collection(db,"videos"),where("userId","==",uid),where("isActive","==",true)));
    const allVideos=vSnap.docs.map(d=>({id:d.id,...d.data()}));
    const videos=allVideos.filter(v=>{const t=v.createdAt?.toDate?.();return t&&t>=since;});
    // Clics por red desde la coleccion 'clicks' (filtrados por fecha real del evento)
    const netMap={};
    let total=0;
    const desdeMs=since.getTime();
    try{
      const cSnap=await getDocs(query(collection(db,"clicks"),where("creatorId","==",uid)));
      cSnap.docs.forEach(d=>{
        const ev=d.data().events||[];
        ev.forEach(e=>{
          if(!e.ts||e.ts<desdeMs)return;
          if(e.tipo!=="social")return;
          const net=e.network||"otra";
          netMap[net]=(netMap[net]||0)+1;
          total++;
        });
      });
    }catch(err){console.warn("clicks:",err);}
    const entries=Object.entries(netMap).sort((a,b)=>b[1]-a[1]);
    document.getElementById("m-total").textContent=total;
    document.getElementById("m-nets").textContent=entries.length;
    document.getElementById("donut-total").textContent=total;
    renderDonut(entries);
    renderBars(entries);
    renderVideos(videos);
  }catch(e){console.error(e);}
}
function renderDonut(entries){
  if(donutChart){donutChart.destroy();donutChart=null;}
  const legendEl=document.getElementById("donut-legend");
  if(entries.length===0){legendEl.innerHTML="<div class=\"empty\">Sin datos aun</div>";return;}
  const labels=entries.map(([n])=>NET_EMOJI[n]||n);
  const data=entries.map(([,v])=>v);
  const colors=entries.map((_,i)=>COLORS[i%COLORS.length]);
  donutChart=new Chart(document.getElementById("donutChart"),{
    type:"doughnut",
    data:{labels,datasets:[{data,backgroundColor:colors,borderColor:"rgba(11,26,48,.9)",borderWidth:3,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"68%",plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.label+": "+ctx.raw+" clics ("+Math.round(ctx.parsed/data.reduce((a,b)=>a+b,0)*100)+"%)"}}},animation:{animateRotate:true,duration:800}}
  });
  legendEl.innerHTML=entries.map(([net,count],i)=>`<div class="legend-item" style="display:flex;align-items:center;gap:10px;background:linear-gradient(115deg,#3d2800,#7a5200,#c8860a,#f0b429,#c8860a,#7a5200,#3d2800);background-size:300% 100%;animation:metalSlide 5s linear infinite;border-radius:14px;padding:10px 14px;"><div style="width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0">${NET_SVG[net]||""}</div><span style="font-size:.85rem;color:#fff;font-weight:600;flex:1;text-shadow:0 1px 4px rgba(0,0,0,.5)">${NET_EMOJI[net]||net}</span><span style="font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5)">${count}</span></div>`).join("");
}
function renderBars(entries){
  if(barsChart){barsChart.destroy();barsChart=null;}
  const wrap=document.querySelector(".bars-chart-wrap");
  if(entries.length===0){wrap.innerHTML="<div class=\"empty\">Sin datos aun</div>";return;}
  const h=Math.max(180,entries.length*44+40);
  wrap.style.height=h+"px";
  wrap.innerHTML='<canvas id="barsChart" role="img" aria-label="Grafico de barras horizontal con ranking de redes sociales">Ranking de redes por numero de clics.</canvas>';
  const labels=entries.map(([n])=>NET_EMOJI[n]||n);
  const data=entries.map(([,v])=>v);
  const colors=entries.map((_,i)=>COLORS[i%COLORS.length]);
  barsChart=new Chart(document.getElementById("barsChart"),{
    type:"bar",
    data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:6,borderSkipped:false}]},
    options:{
      indexAxis:"y",responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw+" clics"}}},
      scales:{
        x:{grid:{color:"rgba(255,255,255,.05)"},ticks:{color:"rgba(255,255,255,.4)",font:{size:11}},border:{color:"rgba(255,255,255,.05)"}},
        y:{grid:{display:false},ticks:{color:"rgba(255,255,255,.7)",font:{size:12,weight:"500"}},border:{display:false}}
      },
      animation:{duration:700}
    }
  });
}
function renderVideos(videos){
  const el=document.getElementById("video-list");
  const withClicks=videos.filter(v=>v.socialClicks>0).sort((a,b)=>(b.socialClicks||0)-(a.socialClicks||0));
  if(withClicks.length===0){el.innerHTML="<div class=\"empty\">Sin videos con clics en redes</div>";return;}
  el.innerHTML=withClicks.map((v,i)=>{
    const nets=Object.keys(v).filter(k=>k.startsWith("net_")&&v[k]>0).sort((a,b)=>v[b]-v[a]).map(k=>`<span class="vchip">${(NET_EMOJI[k.replace("net_","")]||k.replace("net_",""))} ${v[k]}</span>`).join("");
    return`<div class="video-row" style="cursor:pointer" data-vid="${v.id}"><div class="vthumb"><video src="${v.videoURL}" muted preload="metadata" poster="${v.thumbnailURL||''}"></video></div><div class="vinfo"><div class="vdesc">${v.description||v.productName||"Sin descripcion"}</div><div class="vnets">${nets}</div></div><div class="vcount">${v.socialClicks||0}</div></div>`;
  }).join("");
  el.querySelectorAll(".video-row").forEach(row=>{
    row.addEventListener("click",()=>{
      window.location.href="/feed.html?video="+row.dataset.vid;
    });
  });
}
</script>
</body>
