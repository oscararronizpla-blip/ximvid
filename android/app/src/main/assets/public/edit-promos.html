<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editar promociones — Ximvid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#06101e;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:40px;}
.top{display:flex;align-items:center;gap:12px;padding:18px 16px;padding-top:calc(18px + env(safe-area-inset-top));}
.back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;}
.sub{padding:0 16px 16px;color:rgba(255,255,255,.45);font-size:.85rem;line-height:1.5;}
.list{padding:0 16px;display:flex;flex-direction:column;gap:12px;}
.promo-card{display:flex;gap:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;cursor:pointer;transition:all .2s;}
.promo-card:active{transform:scale(.98);}
.promo-thumb{width:64px;height:96px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.05);flex-shrink:0;}
.promo-thumb video,.promo-thumb img{width:100%;height:100%;object-fit:cover;}
.promo-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;}
.promo-type{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#f0b429;font-weight:500;}
.promo-name{font-size:.95rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.promo-price{font-size:.85rem;color:rgba(255,255,255,.6);}
.promo-edit{align-self:center;color:rgba(255,255,255,.4);font-size:1.1rem;}
.empty{text-align:center;padding:60px 30px;color:rgba(255,255,255,.4);font-size:.9rem;line-height:1.6;}
.empty .big{font-size:2.4rem;margin-bottom:12px;}
/* Panel de edicion */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;}
.panel{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:#0a1628;border-radius:22px 22px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom));z-index:91;display:none;}
.panel h3{font-family:'Cormorant Garamond',serif;font-size:1.3rem;margin-bottom:16px;}
.f-label{display:block;font-size:.78rem;color:rgba(255,255,255,.5);margin:14px 0 6px;}
.f-input,.f-textarea,.f-select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-family:'DM Sans',sans-serif;font-size:.92rem;outline:none;}
.f-textarea{min-height:80px;resize:vertical;}
.f-row{display:flex;gap:10px;}
.f-row .f-input{flex:1;}
.f-row .f-select{width:88px;flex-shrink:0;}
.img-preview{width:90px;height:90px;border-radius:14px;object-fit:cover;border:2px solid #c8860a;display:block;margin:8px 0;}
.btn-gold{width:100%;margin-top:22px;padding:15px;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;color:#1a1300;cursor:pointer;background:linear-gradient(115deg,#7a5200,#c8860a,#f0b429,#ffd76a,#f0b429,#c8860a,#7a5200);background-size:300% 100%;animation:metalSlide 5s linear infinite;}
.btn-cancel{width:100%;margin-top:10px;padding:13px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:transparent;color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;}
@keyframes metalSlide{0%{background-position:0% 0}100%{background-position:300% 0}}
.saving{opacity:.6;pointer-events:none;}
</style>
</head>
<body>
<div class="top">
  <div class="back" onclick="window.location.href='/profile.html'">←</div>
  <div class="title">Editar promociones</div>
</div>
<div class="sub">Tus videos con producto o servicio. Toca uno para cambiar textos, precios, foto o botón de contacto.</div>
<div class="list" id="promo-list"></div>
<div class="empty" id="empty" style="display:none"><div class="big">🛍️</div>Aún no tienes videos con promoción.<br>Sube un video y elige "Vender producto" o "Ofrecer servicio".</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel"></div>

<script type="module" src="edit-promos.js"></script>
</body>
</html>
