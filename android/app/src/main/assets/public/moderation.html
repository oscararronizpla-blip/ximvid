<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moderación — Ximvid</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:'DM Sans',sans-serif;}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);}
.top-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;}
.top-count{font-size:.8rem;color:#f0b429;background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.3);padding:5px 12px;border-radius:100px;}
.top-back{font-size:.8rem;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:100px;text-decoration:none;cursor:pointer;}
.mtabs{position:fixed;top:calc(64px + env(safe-area-inset-top));left:10px;z-index:19;display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
.mtab{font-size:.72rem;padding:7px 12px;border-radius:100px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.6);color:rgba(255,255,255,.7);cursor:pointer;font-family:'DM Sans',sans-serif;}
.mtab.active{background:rgba(240,180,41,.25);border-color:#f0b429;color:#f0b429;}
.mfeed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;}
.mslide{height:100vh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000;}
.mslide video{width:100%;height:100%;object-fit:contain;}
.minfo{position:absolute;left:14px;bottom:130px;right:14px;z-index:5;text-shadow:0 1px 4px rgba(0,0,0,.9);}
.muser{font-weight:600;font-size:1rem;margin-bottom:4px;}
.mdesc{font-size:.85rem;color:rgba(255,255,255,.85);line-height:1.4;max-height:60px;overflow:hidden;}
.mtype{display:inline-block;margin-top:6px;font-size:.7rem;color:#f0b429;background:rgba(0,0,0,.5);border:1px solid rgba(240,180,41,.4);padding:3px 10px;border-radius:100px;}
.mbtns{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:14px;}
.mbtn{width:64px;height:64px;border:none;border-radius:50%;font-family:'DM Sans',sans-serif;font-size:.6rem;font-weight:600;cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;}
.mbtn:active{transform:scale(.96);}
.mbtn.ok{background:linear-gradient(115deg,#0d4d2b,#15803d,#22c55e,#15803d,#0d4d2b);color:#fff;}
.mbtn.bad{background:linear-gradient(115deg,#5c0f0f,#991b1b,#dc2626,#991b1b,#5c0f0f);color:#fff;}
.mdone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;pointer-events:none;opacity:0;transition:opacity .3s;font-size:4rem;}
.mdone.show{opacity:1;}
.empty{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,.5);text-align:center;padding:30px;}
.empty .big{font-size:3rem;}
.denied{height:100vh;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);}
.mctrl{position:absolute;left:0;right:0;bottom:88px;z-index:9;padding:0 12px;}
.mtimeline{width:100%;height:22px;display:flex;align-items:center;cursor:pointer;}
.mtrack{width:100%;height:4px;background:rgba(255,255,255,.25);border-radius:2px;position:relative;}
.mprog{height:100%;background:#f0b429;border-radius:2px;width:0%;}
.mtime{font-size:.68rem;color:rgba(255,255,255,.7);text-shadow:0 1px 3px rgba(0,0,0,.8);margin-top:2px;}
.mtools{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:9;display:flex;flex-direction:column;gap:8px;}
.mtool{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;}
.mtool.active{background:rgba(240,180,41,.3);border-color:#f0b429;color:#f0b429;}
</style>
</head>
<body>
<div class="top">
  <a class="top-back" href="/admin">← Panel</a>
  <div class="top-title">🛡️ Moderación</div>
  <div class="top-count" id="count">—</div>
</div>
<div class="mtabs">
  <button class="mtab active" id="tab-pending" onclick="switchTab('pending',this)">⏳ Pendientes</button>
  <button class="mtab" id="tab-approved" onclick="switchTab('approved',this)">✅ Aprobados</button>
  <button class="mtab" id="tab-rejected" onclick="switchTab('rejected',this)">🚫 Rechazados</button>
</div>
<div class="mfeed" id="mfeed"></div>
<script type="module" src="moderation.js"></script>
</body>
</html>
